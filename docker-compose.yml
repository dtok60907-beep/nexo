# Monorepo orchestrator. Run from the repo root: `docker compose up --build`.
# Redis, ownership/migration jobs, and the realtime canvas runtime stay private.
# Caddy is the only public application ingress; database and Canvas ports remain internal.
services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      nexoclip-app:
        condition: service_started
      spite:
        condition: service_started
      spite-realtime:
        condition: service_healthy
    restart: unless-stopped

  nexoclip-postgres:
    image: postgres:16-alpine
    container_name: nexoclip-postgres
    environment:
      POSTGRES_DB: nexoclip
      POSTGRES_USER: nexoclip
      POSTGRES_PASSWORD: nexoclip_dev
    volumes:
      - nexoclip-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexoclip -d nexoclip"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nexoclip-redis:
    image: redis:7-alpine
    container_name: nexoclip-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - nexoclip-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    restart: unless-stopped


  nexoclip-migrate:
    build:
      context: .
      dockerfile: nexoclip-app/Dockerfile
      target: migrate
    environment:
      NODE_ENV: production
      DATABASE_URL_NEXOCLIP: postgres://nexoclip:nexoclip_dev@nexoclip-postgres:5432/nexoclip
      DATABASE_URL: postgres://nexoclip:nexoclip_dev@nexoclip-postgres:5432/nexoclip
    depends_on:
      nexoclip-postgres:
        condition: service_healthy
    restart: "no"

  spite-realtime-migrate:
    build:
      context: ./nexoclip-app/services/spite
      target: migrate-realtime
    environment:
      NODE_ENV: production
      DATABASE_URL_SPITE: ${DATABASE_URL_SPITE:?DATABASE_URL_SPITE is required}
      DATABASE_URL: ${DATABASE_URL_SPITE:?DATABASE_URL_SPITE is required}
    restart: "no"

  spite-ownership-migrate:
    build:
      context: .
      dockerfile: nexoclip-app/Dockerfile
      target: node-runtime
    command: ["node", "scripts/migrate-spite-ownership.mjs"]
    environment:
      NODE_ENV: development
      DATABASE_URL_NEXOCLIP: postgres://nexoclip:nexoclip_dev@nexoclip-postgres:5432/nexoclip
      DATABASE_URL_SPITE: ${DATABASE_URL_SPITE:?DATABASE_URL_SPITE is required}
      SPITE_OWNER_USER_ID: ${SPITE_OWNER_USER_ID:-}
      SPITE_ALLOW_DETERMINISTIC_FIRST_USER: ${SPITE_ALLOW_DETERMINISTIC_FIRST_USER:-1}
    depends_on:
      nexoclip-postgres:
        condition: service_healthy
      nexoclip-migrate:
        condition: service_completed_successfully
      spite-realtime-migrate:
        condition: service_completed_successfully
    restart: "no"

  ai-clip:
    build:
      context: ./nexoclip-app/services/ai-clip
    environment:
      AI_CLIP_RUNTIME_TOKEN: ${AI_CLIP_RUNTIME_TOKEN:?AI_CLIP_RUNTIME_TOKEN is required}
      LOCAL_WHISPER_DEVICE: cpu
      LOCAL_OUTPUT_DIR: /data/output
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    volumes:
      - ai-clip-output:/data/output
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4175/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  nexoclip-asset-storage-init:
    image: busybox:1.37
    command: ["sh", "-c", "mkdir -p /data/assets && chown -R 1001:1001 /data"]
    volumes:
      - nexoclip-assets:/data
    restart: "no"

  nexoclip-image-worker:
    networks:
      - default
      - ai-ugc
    build:
      context: .
      dockerfile: nexoclip-app/Dockerfile
      target: worker
    command: ["node", "src/queue/imageWorker.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://nexoclip:nexoclip_dev@nexoclip-postgres:5432/nexoclip
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@nexoclip-redis:6379
      LOCAL_OBJECT_STORAGE_DIR: /data/assets
      LOCAL_OBJECT_STORAGE_SECRET: ${LOCAL_OBJECT_STORAGE_SECRET:?LOCAL_OBJECT_STORAGE_SECRET is required}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BYTEPLUS_API_KEY: ${BYTEPLUS_API_KEY:-}
      BYTEPLUS_BASE_URL: ${BYTEPLUS_BASE_URL:-}
      BYTEPLUS_SEEDANCE_2_ENDPOINT: ${BYTEPLUS_SEEDANCE_2_ENDPOINT:-}
      BYTEPLUS_SEEDANCE_2_5_ENDPOINT: ${BYTEPLUS_SEEDANCE_2_5_ENDPOINT:-}
      BYTEPLUS_SEEDREAM_5_ENDPOINT: ${BYTEPLUS_SEEDREAM_5_ENDPOINT:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET_NAME:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      IMAGE_WORKER_CONCURRENCY: ${IMAGE_WORKER_CONCURRENCY:-3}
    volumes:
      - nexoclip-assets:/data
    depends_on:
      nexoclip-asset-storage-init:
        condition: service_completed_successfully
      nexoclip-postgres:
        condition: service_healthy
      nexoclip-migrate:
        condition: service_completed_successfully
      nexoclip-redis:
        condition: service_healthy
    restart: unless-stopped

  nexoclip-video-worker:
    networks:
      - default
      - ai-ugc
    build:
      context: .
      dockerfile: nexoclip-app/Dockerfile
      target: worker
    command: ["node", "src/queue/videoWorker.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://nexoclip:nexoclip_dev@nexoclip-postgres:5432/nexoclip
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@nexoclip-redis:6379
      LOCAL_OBJECT_STORAGE_DIR: /data/assets
      LOCAL_OBJECT_STORAGE_SECRET: ${LOCAL_OBJECT_STORAGE_SECRET:?LOCAL_OBJECT_STORAGE_SECRET is required}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BYTEPLUS_API_KEY: ${BYTEPLUS_API_KEY:-}
      BYTEPLUS_ACCESS_KEY_ID: ${BYTEPLUS_ACCESS_KEY_ID}
      BYTEPLUS_SECRET_ACCESS_KEY: ${BYTEPLUS_SECRET_ACCESS_KEY}
      BYTEPLUS_PROJECT_NAME: ${BYTEPLUS_PROJECT_NAME:-default}
      BYTEPLUS_REGION: ${BYTEPLUS_REGION:-ap-southeast-1}
      BYTEPLUS_BASE_URL: ${BYTEPLUS_BASE_URL:-}
      BYTEPLUS_SEEDANCE_2_ENDPOINT: ${BYTEPLUS_SEEDANCE_2_ENDPOINT:-}
      BYTEPLUS_SEEDANCE_2_5_ENDPOINT: ${BYTEPLUS_SEEDANCE_2_5_ENDPOINT:-}
      BYTEPLUS_SEEDREAM_5_ENDPOINT: ${BYTEPLUS_SEEDREAM_5_ENDPOINT:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET_NAME:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      VIDEO_WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-3}
    volumes:
      - nexoclip-assets:/data
    depends_on:
      nexoclip-asset-storage-init:
        condition: service_completed_successfully
      nexoclip-postgres:
        condition: service_healthy
      nexoclip-migrate:
        condition: service_completed_successfully
      nexoclip-redis:
        condition: service_healthy
    restart: unless-stopped


  spite:
    build:
      context: ./nexoclip-app/services/spite
      target: web
      args:
        NEXT_PUBLIC_BASE_PATH: /spite
        NEXT_PUBLIC_STUDIO_URL: ${NEXT_PUBLIC_STUDIO_URL:-http://localhost/studio}
        NEXT_PUBLIC_REALTIME_URL: /spite/ws
    container_name: nexoclip-spite
    environment:
      NODE_ENV: production
      DATABASE_URL_SPITE: ${DATABASE_URL_SPITE:?DATABASE_URL_SPITE is required}
      DATABASE_URL: ${DATABASE_URL_SPITE:?DATABASE_URL_SPITE is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      BYTEPLUS_API_KEY: ${BYTEPLUS_API_KEY:?BYTEPLUS_API_KEY is required}
      BYTEPLUS_BASE_URL: ${BYTEPLUS_BASE_URL:-https://ark.ap-southeast.bytepluses.com/api/v3}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?R2_ACCOUNT_ID is required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?R2_BUCKET_NAME is required}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      R2_PROXY_SIGNING_SECRET: ${R2_PROXY_SIGNING_SECRET:-}
      NEXOCLIP_INTERNAL_URL: ${NEXOCLIP_INTERNAL_URL:-http://nexoclip-app:3000}
      CANVAS_AUTH_URL: ${CANVAS_AUTH_URL:-http://spite-realtime:3007/internal/authorize}
      CANVAS_AUTH_HMAC_SECRET: ${CANVAS_AUTH_HMAC_SECRET:?CANVAS_AUTH_HMAC_SECRET is required}
      CANVAS_AUTH_SECRET: ${CANVAS_AUTH_HMAC_SECRET:?CANVAS_AUTH_HMAC_SECRET is required}
      REALTIME_TOKEN_SECRET: ${REALTIME_JWT_SECRET:?REALTIME_JWT_SECRET is required}
      NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-/spite/ws}
    depends_on:
      spite-realtime-migrate:
        condition: service_completed_successfully
      spite-ownership-migrate:
        condition: service_completed_successfully
      spite-realtime:
        condition: service_healthy
    restart: unless-stopped

  spite-realtime:
    build:
      context: ./nexoclip-app/services/spite
      target: realtime
    container_name: nexoclip-spite-realtime
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3007
      DATABASE_URL_SPITE: ${DATABASE_URL_SPITE:?DATABASE_URL_SPITE is required}
      DATABASE_URL: ${DATABASE_URL_SPITE:?DATABASE_URL_SPITE is required}
      CANVAS_AUTH_HMAC_SECRET: ${CANVAS_AUTH_HMAC_SECRET:?CANVAS_AUTH_HMAC_SECRET is required}
      CANVAS_AUTH_SECRET: ${CANVAS_AUTH_HMAC_SECRET:?CANVAS_AUTH_HMAC_SECRET is required}
      REALTIME_JWT_SECRET: ${REALTIME_JWT_SECRET:?REALTIME_JWT_SECRET is required}
      REALTIME_TOKEN_SECRET: ${REALTIME_JWT_SECRET:?REALTIME_JWT_SECRET is required}
      SPITE_REALTIME_MAX_QUEUED_UPDATES: ${SPITE_REALTIME_MAX_QUEUED_UPDATES:-256}
      SPITE_REALTIME_MAX_QUEUED_BYTES: ${SPITE_REALTIME_MAX_QUEUED_BYTES:-524288}
      SPITE_REALTIME_SNAPSHOT_INTERVAL_MS: ${SPITE_REALTIME_SNAPSHOT_INTERVAL_MS:-30000}
      SPITE_REALTIME_COMPACT_AFTER_UPDATES: ${SPITE_REALTIME_COMPACT_AFTER_UPDATES:-128}
    depends_on:
      spite-realtime-migrate:
        condition: service_completed_successfully
      spite-ownership-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3007/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nexoclip-app:
    build:
      context: .
      dockerfile: nexoclip-app/Dockerfile
      target: web
      args:
        # Caddy owns the public canvas route; do not expose the Spite app port in the UI.
        NEXT_PUBLIC_SPITE_URL: ${NEXT_PUBLIC_SPITE_URL:-http://localhost/spite}
    container_name: nexoclip-app
    networks:
      - default
      - ai-ugc
    environment:
      NODE_ENV: production
      DATABASE_URL_NEXOCLIP: postgres://nexoclip:nexoclip_dev@nexoclip-postgres:5432/nexoclip
      DATABASE_URL: postgres://nexoclip:nexoclip_dev@nexoclip-postgres:5432/nexoclip
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@nexoclip-redis:6379
      MUAPI_API_KEY: ${MUAPI_API_KEY:-}
      AI_CLIP_RUNTIME_URL: http://ai-clip:4175
      SPITE_INTERNAL_URL: http://spite:3005/spite
      AI_CLIP_RUNTIME_TOKEN: ${AI_CLIP_RUNTIME_TOKEN:?AI_CLIP_RUNTIME_TOKEN is required}
      LOCAL_OBJECT_STORAGE_DIR: /data/assets
      LOCAL_OBJECT_STORAGE_SECRET: ${LOCAL_OBJECT_STORAGE_SECRET:?LOCAL_OBJECT_STORAGE_SECRET is required}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      BYTEPLUS_API_KEY: ${BYTEPLUS_API_KEY:-}
      BYTEPLUS_ACCESS_KEY_ID: ${BYTEPLUS_ACCESS_KEY_ID}
      BYTEPLUS_SECRET_ACCESS_KEY: ${BYTEPLUS_SECRET_ACCESS_KEY}
      BYTEPLUS_PROJECT_NAME: ${BYTEPLUS_PROJECT_NAME:-default}
      BYTEPLUS_REGION: ${BYTEPLUS_REGION:-ap-southeast-1}
      BYTEPLUS_BASE_URL: ${BYTEPLUS_BASE_URL:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET_NAME:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_ORIGIN: ${GOOGLE_OAUTH_ORIGIN:-}
      CANVAS_AUTH_URL: ${CANVAS_AUTH_URL:-http://spite-realtime:3007/internal/authorize}
      CANVAS_AUTH_HMAC_SECRET: ${CANVAS_AUTH_HMAC_SECRET:?CANVAS_AUTH_HMAC_SECRET is required}
      CANVAS_AUTH_SECRET: ${CANVAS_AUTH_HMAC_SECRET:?CANVAS_AUTH_HMAC_SECRET is required}
      REALTIME_JWT_SECRET: ${REALTIME_JWT_SECRET:?REALTIME_JWT_SECRET is required}
      REALTIME_TOKEN_SECRET: ${REALTIME_JWT_SECRET:?REALTIME_JWT_SECRET is required}
    volumes:
      - nexoclip-assets:/data
    depends_on:
      nexoclip-asset-storage-init:
        condition: service_completed_successfully
      nexoclip-postgres:
        condition: service_healthy
      nexoclip-migrate:
        condition: service_completed_successfully
      nexoclip-redis:
        condition: service_healthy
      ai-clip:
        condition: service_healthy
    restart: unless-stopped

networks:
  ai-ugc:
    external: true
    name: ai-ugc_default

volumes:
  nexoclip-postgres-data:
    external: true
    name: open-generative-ai_nexoclip-postgres-data
  caddy-data:
  caddy-config:
  nexoclip-redis-data:
  nexoclip-assets:
  ai-clip-output:
