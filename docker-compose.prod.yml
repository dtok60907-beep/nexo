name: nexoclip

services:
  caddy:
    image: caddy:2.10-alpine
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      nexoclip: { condition: service_healthy }
      spite: { condition: service_healthy }
      spite-realtime: { condition: service_healthy }
      ai-clip: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexoclip
      POSTGRES_USER: nexoclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-production-postgres.sh:/docker-entrypoint-initdb.d/01-ready.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexoclip -d nexoclip"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-bookworm
    platform: linux/amd64
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  nexoclip-migrate:
    platform: linux/amd64
    build:
      context: ./nexoclip-app
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://nexoclip:${POSTGRES_PASSWORD}@postgres:5432/nexoclip
    depends_on:
      postgres: { condition: service_healthy }

  spite-realtime-migrate:
    platform: linux/amd64
    build:
      context: ./nexoclip-app/services/spite
      target: migrate-realtime
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL_SPITE: ${DATABASE_URL_SPITE}
      DATABASE_URL: ${DATABASE_URL_SPITE}

  spite-ownership-migrate:
    platform: linux/amd64
    build:
      context: ./nexoclip-app
      target: node-runtime
    command: ["node", "scripts/migrate-spite-ownership.mjs"]
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL_NEXOCLIP: postgresql://nexoclip:${POSTGRES_PASSWORD}@postgres:5432/nexoclip
      DATABASE_URL_SPITE: ${DATABASE_URL_SPITE}
      SPITE_OWNER_USER_ID: ${SPITE_OWNER_USER_ID}
    depends_on:
      nexoclip-migrate: { condition: service_completed_successfully }
      spite-realtime-migrate: { condition: service_completed_successfully }

  ai-clip:
    platform: linux/amd64
    build:
      context: ./nexoclip-app/services/ai-clip
    restart: unless-stopped
    environment:
      AI_CLIP_RUNTIME_TOKEN: ${AI_CLIP_RUNTIME_TOKEN}
      LOCAL_WHISPER_DEVICE: cpu
      LOCAL_OUTPUT_DIR: /data/output
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    volumes:
      - ai-clip-output:/data/output
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4175/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20

  asset-storage-init:
    image: busybox:1.37
    platform: linux/amd64
    restart: "no"
    command: ["sh", "-c", "mkdir -p /data && chown -R 1000:1000 /data"]
    volumes:
      - nexoclip-assets:/data

  nexoclip:
    platform: linux/amd64
    build:
      context: ./nexoclip-app
      target: web
      args:
        NEXT_PUBLIC_SPITE_URL: /spite
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SPITE_URL: /spite
      DATABASE_URL_NEXOCLIP: postgresql://nexoclip:${POSTGRES_PASSWORD}@postgres:5432/nexoclip
      DATABASE_URL: postgresql://nexoclip:${POSTGRES_PASSWORD}@postgres:5432/nexoclip
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LOCAL_OBJECT_STORAGE_SECRET: ${LOCAL_OBJECT_STORAGE_SECRET}
      MUAPI_API_KEY: ${MUAPI_API_KEY}
      MUAPI_BASE_URL: ${MUAPI_BASE_URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BYTEPLUS_API_KEY: ${BYTEPLUS_API_KEY}
      BYTEPLUS_ACCESS_KEY_ID: ${BYTEPLUS_ACCESS_KEY_ID}
      BYTEPLUS_SECRET_ACCESS_KEY: ${BYTEPLUS_SECRET_ACCESS_KEY}
      BYTEPLUS_PROJECT_NAME: ${BYTEPLUS_PROJECT_NAME:-default}
      BYTEPLUS_REGION: ${BYTEPLUS_REGION:-ap-southeast-1}
      BYTEPLUS_BASE_URL: ${BYTEPLUS_BASE_URL}
      AI_CLIP_RUNTIME_URL: http://ai-clip:4175
      AI_CLIP_RUNTIME_TOKEN: ${AI_CLIP_RUNTIME_TOKEN}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      LOCAL_OBJECT_STORAGE_DIR: /data/assets
      CANVAS_AUTH_URL: ${CANVAS_AUTH_URL:?CANVAS_AUTH_URL is required}
      CANVAS_AUTH_HMAC_SECRET: ${CANVAS_AUTH_HMAC_SECRET}
      CANVAS_AUTH_SECRET: ${CANVAS_AUTH_HMAC_SECRET}
      REALTIME_JWT_SECRET: ${REALTIME_JWT_SECRET:?REALTIME_JWT_SECRET is required}
      REALTIME_TOKEN_SECRET: ${REALTIME_JWT_SECRET:?REALTIME_JWT_SECRET is required}
    volumes:
      - nexoclip-assets:/data
    depends_on:
      asset-storage-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      nexoclip-migrate: { condition: service_completed_successfully }
      ai-clip: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20

  spite:
    platform: linux/amd64
    build:
      context: ./nexoclip-app/services/spite
      target: web
      args:
        NEXT_PUBLIC_BASE_PATH: /spite
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-/spite/ws}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL_SPITE: ${DATABASE_URL_SPITE}
      DATABASE_URL: ${DATABASE_URL_SPITE}
      CRON_SECRET: ${SPITE_CRON_SECRET}
      FAL_KEY: ${FAL_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BYTEPLUS_API_KEY: ${BYTEPLUS_API_KEY}
      BYTEPLUS_BASE_URL: ${BYTEPLUS_BASE_URL}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      R2_PROXY_SIGNING_SECRET: ${R2_PROXY_SIGNING_SECRET}
      NEXOCLIP_INTERNAL_URL: ${NEXOCLIP_INTERNAL_URL:?NEXOCLIP_INTERNAL_URL is required}
      CANVAS_AUTH_URL: ${CANVAS_AUTH_URL:?CANVAS_AUTH_URL is required}
      CANVAS_AUTH_HMAC_SECRET: ${CANVAS_AUTH_HMAC_SECRET}
      CANVAS_AUTH_SECRET: ${CANVAS_AUTH_HMAC_SECRET}
      REALTIME_TOKEN_SECRET: ${REALTIME_JWT_SECRET:?REALTIME_JWT_SECRET is required}
      NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:?NEXT_PUBLIC_REALTIME_URL is required}
    depends_on:
      spite-realtime-migrate: { condition: service_completed_successfully }
      spite-ownership-migrate: { condition: service_completed_successfully }
      spite-realtime: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/spite').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20

  spite-realtime:
    platform: linux/amd64
    build:
      context: ./nexoclip-app/services/spite
      target: realtime
    restart: unless-stopped
    expose:
      - "3007"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3007
      DATABASE_URL_SPITE: ${DATABASE_URL_SPITE}
      DATABASE_URL: ${DATABASE_URL_SPITE}
      CANVAS_AUTH_HMAC_SECRET: ${CANVAS_AUTH_HMAC_SECRET}
      CANVAS_AUTH_SECRET: ${CANVAS_AUTH_HMAC_SECRET}
      REALTIME_JWT_SECRET: ${REALTIME_JWT_SECRET:?REALTIME_JWT_SECRET is required}
      REALTIME_TOKEN_SECRET: ${REALTIME_JWT_SECRET:?REALTIME_JWT_SECRET is required}
      SPITE_REALTIME_MAX_QUEUED_UPDATES: ${SPITE_REALTIME_MAX_QUEUED_UPDATES:-256}
      SPITE_REALTIME_MAX_QUEUED_BYTES: ${SPITE_REALTIME_MAX_QUEUED_BYTES:-524288}
      SPITE_REALTIME_SNAPSHOT_INTERVAL_MS: ${SPITE_REALTIME_SNAPSHOT_INTERVAL_MS:-30000}
      SPITE_REALTIME_COMPACT_AFTER_UPDATES: ${SPITE_REALTIME_COMPACT_AFTER_UPDATES:-128}
    depends_on:
      spite-realtime-migrate: { condition: service_completed_successfully }
      spite-ownership-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3007/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20

  image-worker:
    platform: linux/amd64
    build:
      context: ./nexoclip-app
      target: worker
    command: ["node", "src/queue/imageWorker.mjs"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://nexoclip:${POSTGRES_PASSWORD}@postgres:5432/nexoclip
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LOCAL_OBJECT_STORAGE_DIR: /data/assets
      LOCAL_OBJECT_STORAGE_SECRET: ${LOCAL_OBJECT_STORAGE_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BYTEPLUS_API_KEY: ${BYTEPLUS_API_KEY}
      BYTEPLUS_BASE_URL: ${BYTEPLUS_BASE_URL}
      BYTEPLUS_SEEDANCE_2_ENDPOINT: ${BYTEPLUS_SEEDANCE_2_ENDPOINT:-}
      BYTEPLUS_SEEDANCE_2_5_ENDPOINT: ${BYTEPLUS_SEEDANCE_2_5_ENDPOINT:-}
      BYTEPLUS_SEEDREAM_5_ENDPOINT: ${BYTEPLUS_SEEDREAM_5_ENDPOINT:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET_NAME}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      IMAGE_WORKER_CONCURRENCY: ${IMAGE_WORKER_CONCURRENCY:-3}
    volumes:
      - nexoclip-assets:/data
    depends_on:
      asset-storage-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      nexoclip-migrate: { condition: service_completed_successfully }

  video-worker:
    platform: linux/amd64
    build:
      context: ./nexoclip-app
      target: worker
    command: ["node", "src/queue/videoWorker.mjs"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://nexoclip:${POSTGRES_PASSWORD}@postgres:5432/nexoclip
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LOCAL_OBJECT_STORAGE_DIR: /data/assets
      LOCAL_OBJECT_STORAGE_SECRET: ${LOCAL_OBJECT_STORAGE_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BYTEPLUS_API_KEY: ${BYTEPLUS_API_KEY}
      BYTEPLUS_ACCESS_KEY_ID: ${BYTEPLUS_ACCESS_KEY_ID}
      BYTEPLUS_SECRET_ACCESS_KEY: ${BYTEPLUS_SECRET_ACCESS_KEY}
      BYTEPLUS_PROJECT_NAME: ${BYTEPLUS_PROJECT_NAME:-default}
      BYTEPLUS_REGION: ${BYTEPLUS_REGION:-ap-southeast-1}
      BYTEPLUS_BASE_URL: ${BYTEPLUS_BASE_URL}
      BYTEPLUS_SEEDANCE_2_ENDPOINT: ${BYTEPLUS_SEEDANCE_2_ENDPOINT:-}
      BYTEPLUS_SEEDANCE_2_5_ENDPOINT: ${BYTEPLUS_SEEDANCE_2_5_ENDPOINT:-}
      BYTEPLUS_SEEDREAM_5_ENDPOINT: ${BYTEPLUS_SEEDREAM_5_ENDPOINT:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET_NAME}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      VIDEO_WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-3}
    volumes:
      - nexoclip-assets:/data
    depends_on:
      asset-storage-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      nexoclip-migrate: { condition: service_completed_successfully }

volumes:
  nexoclip-assets:
  postgres-data:
  redis-data:
  ai-clip-output:
  caddy-data:
  caddy-config:
